# Testes e build Windows com GameCI.
# Roda manualmente (Actions → Build → Run workflow) ou ao criar uma tag de versão (v0.1.0, v0.2.0...).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   conteúdo do arquivo .ulf da licença Unity
#   UNITY_EMAIL     e-mail da conta Unity
#   UNITY_PASSWORD  senha da conta Unity
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Testes (EditMode + PlayMode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows x64 (IL2CPP)
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-win-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-win-
      - name: Versão
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildMethod: Addicted.Editor.Build.BuildScript.BuildWindows
          customParameters: -buildVersion ${{ steps.version.outputs.value }} -buildPath build/StandaloneWindows64
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: Addicted-${{ steps.version.outputs.value }}-Windows
          path: build/StandaloneWindows64
